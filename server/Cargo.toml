[package]
name = "funban-server"
version = "1.2.14"
edition = "2021"

[[bin]]
name = "funban-server"
path = "src/main.rs"

[[bin]]
name = "create_admin"
path = "src/bin/create_admin.rs"


[dependencies]
axum = { version = "0.8.4", features = [
	"multipart",
	"macros",
	"ws",
	"tracing",
] }
axum-extra = { version = "0.12.1", features = ["cookie"] }
tower = "0.5.3"
tower-http = { version = "0.6.9", features = [
	"cors",
	"fs",
	"trace",
	"add-extension",
] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
ts-rs = { version = "10.1", features = ["serde-compat", "chrono-impl"] }
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.17.0", features = ["v4"] }
anyhow = "1.0.98"
thiserror = "2.0.12"
sqlx = { version = "0.8.6", features = [
	"runtime-tokio",
	"tls-rustls",
	"mysql",
	"chrono",
	"migrate",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
dotenvy = "0.15.0"
jsonwebtoken = "9.3.1"
chrono = { version = "0.4.41", features = ["serde"] }
rand = "0.10.1"
config = { version = "0.15.11" }
futures = "0.3.32"
bytes = "1"
json-patch = "4.0.0"
utoipa = { version = "5.4.0", features = ["chrono"] }
argon2 = { version = "0.5.3" }
cookie = "0.18.1"
base64 = "0.22.1"

[build-dependencies]
serde_json = "1.0.140"
