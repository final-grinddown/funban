name: Server PR Checks

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true
  DATABASE_URL: mysql://root:8861a78310f7c1d1a3f01849350b36f1@localhost:3306/funban?ssl-mode=DISABLED

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**/*.rs'
              - 'server/src/**'
              - 'server/.cargo/**'
              - 'server/migrations/**'
              - 'server/.sqlx/**'
              - 'server/Cargo.toml'
              - 'server/Cargo.lock'

  format-check:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Format SQLx files
        run: |
          unformatted=0
          for file in .sqlx/*.json; do
            if [ -f "$file" ]; then
              if ! jq -e . "$file" >/dev/null 2>&1; then
                echo "::error::Found invalid JSON in SQLx files"
                exit 1
              fi
              
              # Create normalized version and replace the original
              jq -S "
                .query |= gsub(\"\\\\s+$\"; \"\") |
                .query |= gsub(\"^\\\\s+\"; \"\")
              " "$file" > "$file.tmp" && mv "$file.tmp" "$file"
              
              if [ $? -ne 0 ]; then
                ((unformatted++))
              fi
            fi
          done

          if [ $unformatted -gt 0 ]; then
            git add .sqlx/
            git commit -m "chore: format SQLx files [skip ci]"
            git push
            echo "::notice::Formatted SQLx files and pushed changes"
          fi

  lint:
    needs: [changes, format-check]
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

  build-test-and-prepare:
    needs: [changes, lint]
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libmysqlclient-dev -y

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
            ~/.cargo/bin/sqlx
          key: ${{ runner.os }}-cargo-server-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-server-

      - name: Install sqlx-cli
        run: |
          if ! command -v sqlx &> /dev/null; then
            echo "Installing sqlx-cli..."
            cargo install sqlx-cli --no-default-features --features mysql
          else
            echo "sqlx-cli already installed"
          fi

      - name: Debug cargo and sqlx version
        run: |
          cargo --version
          sqlx --version

      - name: Run migrations
        run: sqlx migrate run --database-url "${{ env.DATABASE_URL }}"

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Generate SQLx data
        run: |
          # Temporarily disable offline mode to generate the data
          unset SQLX_OFFLINE

          echo "Running SQLx prepare..."
          cargo sqlx prepare -- --bins --tests

          # Check if any changes were made to the sqlx directory
          if git diff --name-only | grep -q '.sqlx/'; then
            echo "SQLx data has been updated. Committing changes..."
            git add .sqlx/
            git commit -m "chore: update SQLx offline data [skip ci]"
            git push
            echo "::notice::Updated SQLx offline data and pushed changes"
          else
            echo "No changes to SQLx data"
          fi

    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: 8861a78310f7c1d1a3f01849350b36f1
          MYSQL_USER: mysql
          MYSQL_PASSWORD: 17ff8b3e0828c7b4a0a77238fa95e12d
          MYSQL_DATABASE: funban
          MYSQL_SSL_MODE: DISABLED
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5