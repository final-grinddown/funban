# Dependabot configuration for security and dependency monitoring
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Monitor web (Next.js frontend) dependencies
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    ignore:
      # Special handling for archived unplugin-typia
      - dependency-name: "@ryoppippi/unplugin-typia"
        # Archived but functional - version pinned intentionally
        # See: docs/architecture/validation.md
      - dependency-name: "typia"
        # Pinned to work with unplugin-typia
        # Update only when testing new versions
      # Major upgrades are done manually as dedicated migrations
      - dependency-name: "@mui/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zustand"
        update-types: ["version-update:semver-major"]
      # Must track the Node runtime major (see web/Dockerfile and CI)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # Group minor and patch updates
    groups:
      react:
        # react and react-dom must always share the exact same version
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      mui:
        patterns:
          - "@mui/*"
      testing:
        patterns:
          - "@testing-library/*"
          - "jest*"
      typescript:
        patterns:
          - "typescript"
          - "@types/*"

  # Monitor Rust backend dependencies
  - package-ecosystem: "cargo"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    ignore:
      # Major upgrades change the generated TypeScript contracts; done manually
      - dependency-name: "ts-rs"
        update-types: ["version-update:semver-major"]
    groups:
      # Group axum ecosystem updates
      axum:
        patterns:
          - "axum*"
          - "tower*"
      # Everything else: minor and patch updates in a single PR
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Monitor GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions:
        patterns:
          - "*"
